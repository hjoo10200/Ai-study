<!DOCTYPE html>
<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spring AI</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link href="/css/springai.css" rel="stylesheet" />
  <script src="/js/springai.js"></script>
  <script>
    function fillOrderExample(button) {
      const input = document.getElementById("question");
      input.value = button.dataset.order;
      input.focus();
    }

    // ##### 제출 버튼을 클릭했을 때 실행하는 함수 #####
    async function handleSubmit() {
      try {
        // 텍스트 질문을 얻고 대화 패널에 추가하기
        const question = document.getElementById("question").value;
        if (question === "") return;
        springai.addUserQuestion(question, "chatPanel");

        // 응답이 오기까지 스피너 보여주기
        springai.setSpinner("spinner", true);

        // AJAX 요청하고 응답받기
        const response = await fetch('/ai/generic-bean-output-converter2', {
          method: "post",
					headers: {
						'Content-Type': 'application/x-www-form-urlencoded',
						'Accept': 'application/json'
					},
          body: new URLSearchParams({ order: question })
        });

        // AI 모델 답변이 들어갈 위치를 대화 패널에 추가
        const uuid = springai.addAnswerPlaceHolder("chatPanel");
        
        // JSON 답변 출력하기
        const jsonString = await response.text();
        springai.printAnswerJson(jsonString, uuid, "chatPanel");
      } catch (error) {
        console.log(error)
      } finally {
        //스피너 숨기기
        springai.setSpinner("spinner", false);
      }
    } 
  </script>
</head>

<body>
  <div class="d-flex flex-column vh-100">
    <div id="headPanel" class="navbar justify-content-between">
      <a href="/" class="navbar-brand ps-2">
        <img src="/image/spring_ai_logo_with_text.svg" width="200" />
      </a>
      <div id="spinner" class="spinner-border text-success d-none me-3" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <div id="chatPanel" class="flex-grow-1 container-fluid h-100 my-2" style="overflow-y:auto; overflow-x:hidden;">
      <div class="d-flex justify-content-start border-bottom m-2">
        <table>
          <tr>
            <td><img src="/image/assistant.png" width="50" /></td>
            <td><span>피자를 주문해주세요</span></td>
          </tr>
        </table>
      </div>
    </div>

    <div id="inputPanel" class="bg-secondary-subtle">
      <div class="d-flex flex-wrap gap-2 px-2 pt-2" role="group" aria-label="피자 주문 예시">
        <button type="button" class="btn btn-outline-secondary btn-sm"
          data-order="페퍼로니 피자 라지 한 판 주세요. 올리브도 추가해 주세요."
          onclick="fillOrderExample(this)">한 판 주문</button>
        <button type="button" class="btn btn-outline-secondary btn-sm"
          data-order="마르게리타 피자 미디엄 한 판과 불고기 피자 라지 한 판 주세요. 마르게리타에는 바질을, 불고기에는 치즈를 추가해 주세요."
          onclick="fillOrderExample(this)">두 판 주문</button>
        <button type="button" class="btn btn-outline-secondary btn-sm"
          data-order="페퍼로니 라지, 마르게리타 미디엄, 불고기 스몰을 한 판씩 주세요. 페퍼로니에는 올리브를, 마르게리타에는 바질을, 불고기에는 버섯을 추가해 주세요."
          onclick="fillOrderExample(this)">세 판 주문</button>
      </div>
      <div class="input-group p-2">
        <span class="input-group-text">피자주문</span>
        <textarea id="question" class="form-control" aria-label="피자 주문"></textarea>
        <span class="input-group-text">
          <button type="button" class="btn btn-primary" onclick="handleSubmit()">제출</button>
        </span>
      </div>
    </div>
  </div>
</body>

</html>
